services:
  - type: web
    name: ass-jass
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --bind 0.0.0.0:$PORT --timeout 60
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: ass-jass-db
          property: connectionString
databases:
  - name: ass-jass-db
    plan: basic-256mb
    databaseName: ass_jass
    user: ass_jass
